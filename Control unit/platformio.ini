[env:nanoatmega328]
platform = atmelavr

; board = leonardo
; board = uno
; board = pro16MHzatmega328
board = nanoatmega328

framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = 
	olikraus/U8g2@^2.34.18
	; gyverlibs/EncButton@^3.0
	gyverlibs/GyverTimers@^1.10
	watterott/digitalWriteFast@^1.0.0
	luisllamasbinaburo/InterpolationLib@^1.0.0
; upload_flags = -V
upload_port = COM11
monitor_port = COM11

