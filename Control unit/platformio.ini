; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = 
	gyverlibs/GyverTimers@^1.10
	watterott/digitalWriteFast@^1.0.0
	luisllamasbinaburo/InterpolationLib@^1.0.0
	powerbroker2/SafeString@^4.1.32
upload_port = COM11
monitor_port = COM11
upload_flags = -V



[env:program_via_USBasp]
platform = atmelavr
framework = arduino
board = nanoatmega328
upload_protocol = custom
upload_port = usb
upload_flags =
    -C
    ; use "tool-avrdude-megaavr" for the atmelmegaavr platform
    ${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -p
    $BOARD_MCU
    -P
    $UPLOAD_PORT
    -c
    usbasp
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i
lib_deps = 
	gyverlibs/GyverTimers@^1.10
	watterott/digitalWriteFast@^1.0.0
	luisllamasbinaburo/InterpolationLib@^1.0.0
	powerbroker2/SafeString@^4.1.32


[env:nano_bootloader]
platform = atmelavr
framework = arduino
board = nanoatmega328

upload_protocol = custom
upload_port = usb
upload_flags =
    -C
    ; use "tool-avrdude-megaavr" for the atmelmegaavr platform
    ${platformio.packages_dir}/tool-avrdude/avrdude.conf
    -p
    $BOARD_MCU
    -P
    $UPLOAD_PORT
    -c
    usbasp
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i

board_bootloader.file = /bootloaders/boot.hex
board_bootloader.lfuse = 0xFF
board_bootloader.hfuse = 0xDE
board_bootloader.efuse = 0xFD
board_bootloader.lock_bits = 0x0F
board_bootloader.unlock_bits = 0x3F

lib_deps = 
	gyverlibs/GyverTimers@^1.10
	watterott/digitalWriteFast@^1.0.0
	luisllamasbinaburo/InterpolationLib@^1.0.0
	powerbroker2/SafeString@^4.1.32